[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sindhi-tokenizer"
version = "1.1.0"
description = "A SentencePiece Unigram tokenizer and lightweight Python SDK purpose-built for Sindhi."
readme = "README.md"
authors = [
  { name = "Ali Nawaz" },
  { name = "Muqadas Fareed" },
  { name = "Soonh Sadaf" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["sindhi", "tokenizer", "sentencepiece", "unigram", "nlp", "low-resource-languages"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
  "sentencepiece>=0.1.99",
  "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
training = [
  "datasets>=2.14.0",
  "numpy>=1.22.0",
  "pandas>=1.5.0",
]
demo = [
  "gradio>=4.0.0",
  "transformers>=4.30.0",
]
dev = ["build>=1.2.0", "pytest>=7.4.0", "twine>=5.0.0"]

[project.urls]
Homepage = "https://github.com/alinawazcode/sindhi-tokenizer"
Repository = "https://github.com/alinawazcode/sindhi-tokenizer"
Models = "https://huggingface.co/alinawazmahar/sindhi-tokenizer"
Documentation = "https://alinawazcode.github.io/sindhi-tokenizer/"
Preprint = "https://doi.org/10.20944/preprints202611.1598.v1"
Zenodo = "https://doi.org/10.5281/zenodo.23962474"

[tool.setuptools.packages.find]
where = ["."]
include = ["evaluation*", "training*", "sindhi_tokenizer*"]

[tool.setuptools.package-data]
sindhi_tokenizer = ["py.typed"]
